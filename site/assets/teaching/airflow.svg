<text class="label" x="520" y="120">1 肺部供應氣流</text><text class="label" x="520" y="210">2 氣流經過氣管</text><text class="label" x="520" y="300">3 喉部聲帶振動</text><text class="label" x="520" y="390">4 聲音進入聲道</text><text class="small muted" x="520" y="450">咽腔、口腔與鼻腔改變聲音。</text><text class="small muted" x="520" y="495">橫膈膜與呼吸肌協助肺部通氣。</text><text class="small muted" x="520" y="540">空氣不會先流進腹部或橫膈膜。</text><text class="small" x="120" y="659">橫膈膜（肺部下方）</text><text class="small muted" x="520" y="635">簡化構造示意；依 NIDCD 核對</text></svg>